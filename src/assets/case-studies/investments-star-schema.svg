    <line x1="20" y1="56" x2="440" y2="56" stroke="#262626"/>

    <g fill="none" stroke-width="1.5">
      <path d="M170,135 L250,210" stroke="#3B82F6" opacity="0.6"/>
      <path d="M170,185 L250,210" stroke="#3B82F6" opacity="0.6"/>
      <path d="M170,270 L250,210" stroke="#3B82F6" opacity="0.6"/>
    </g>

    <!-- dim_currency (two roles: from / to) -->
    <rect x="20" y="110" width="150" height="100" rx="8" fill="#141414" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="20" y="110" width="150" height="24" rx="8" fill="#3B82F6"/>
    <rect x="20" y="126" width="150" height="8" fill="#3B82F6"/>
    <text x="30" y="127" font-size="11" font-weight="700" fill="#0A0A0A">dim_currency</text>
    <text x="30" y="160" font-size="10.5" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#FAFAFA">currency_id</text>
    <text x="162" y="160" font-size="9" font-weight="700" fill="#6FA8FA" text-anchor="end">PK</text>
    <text x="30" y="182" font-size="9.5" font-style="italic" fill="#999999">(used as from and to)</text>

    <!-- dim_date -->
    <rect x="20" y="230" width="150" height="80" rx="8" fill="#141414" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="20" y="230" width="150" height="24" rx="8" fill="#3B82F6"/>
    <rect x="20" y="246" width="150" height="8" fill="#3B82F6"/>
    <text x="30" y="247" font-size="11" font-weight="700" fill="#0A0A0A">dim_date</text>
    <text x="30" y="280" font-size="10.5" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#FAFAFA">date_id</text>
    <text x="162" y="280" font-size="9" font-weight="700" fill="#6FA8FA" text-anchor="end">PK</text>

    <!-- fact box -->
