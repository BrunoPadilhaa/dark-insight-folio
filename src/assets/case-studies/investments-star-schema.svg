    <text x="30" y="320" font-size="10.5" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#FAFAFA">date_id</text>
    <text x="162" y="320" font-size="9" font-weight="700" fill="#6FA8FA" text-anchor="end">PK</text>

