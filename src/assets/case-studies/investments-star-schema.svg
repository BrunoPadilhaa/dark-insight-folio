    <text x="266" y="178" font-size="11" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#999999">rate_date_id</text>
    <text x="424" y="178" font-size="9" font-weight="700" fill="#3B82F6" text-anchor="end">FK</text>
    <text x="266" y="202" font-size="11" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#999999">currency_id_from</text>
    <text x="424" y="202" font-size="9" font-weight="700" fill="#3B82F6" text-anchor="end">FK</text>
    <text x="266" y="226" font-size="11" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#999999">currency_id_to</text>
    <text x="424" y="226" font-size="9" font-weight="700" fill="#3B82F6" text-anchor="end">FK</text>
    <text x="266" y="250" font-size="11" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#999999">exchange_rate</text>
  </g>

  <!-- Panel 4: fct_portfolio_snapshots_daily -->
  <g transform="translate(530,440)">
    <rect width="460" height="370" rx="10" fill="#141414" stroke="#262626" stroke-width="1.5"/>
    <text x="20" y="28" font-size="15" font-weight="700" fill="#6FA8FA">fct_portfolio_snapshots_daily</text>
    <text x="20" y="46" font-size="10.5" font-style="italic" fill="#999999">1 row per asset_id + date_id, held positions only</text>
    <line x1="20" y1="56" x2="440" y2="56" stroke="#262626"/>

    <g fill="none" stroke-width="1.5">
      <path d="M170,110 L250,210" stroke="#3B82F6" opacity="0.6"/>
      <path d="M170,210 L250,210" stroke="#3B82F6" opacity="0.6"/>
      <path d="M170,310 L250,210" stroke="#3B82F6" opacity="0.6"/>
    </g>

    <!-- dim_date -->
    <rect x="20" y="70" width="150" height="80" rx="8" fill="#141414" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="20" y="70" width="150" height="24" rx="8" fill="#3B82F6"/>
    <rect x="20" y="86" width="150" height="8" fill="#3B82F6"/>
    <text x="30" y="87" font-size="11" font-weight="700" fill="#0A0A0A">dim_date</text>
    <text x="30" y="120" font-size="10.5" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#FAFAFA">date_id</text>
    <text x="162" y="120" font-size="9" font-weight="700" fill="#6FA8FA" text-anchor="end">PK</text>

    <!-- dim_asset -->
    <rect x="20" y="170" width="150" height="80" rx="8" fill="#141414" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="20" y="170" width="150" height="24" rx="8" fill="#3B82F6"/>
    <rect x="20" y="186" width="150" height="8" fill="#3B82F6"/>
    <text x="30" y="187" font-size="11" font-weight="700" fill="#0A0A0A">dim_asset</text>
    <text x="30" y="220" font-size="10.5" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#FAFAFA">asset_id</text>
    <text x="162" y="220" font-size="9" font-weight="700" fill="#6FA8FA" text-anchor="end">PK</text>

    <!-- dim_currency -->
    <rect x="20" y="270" width="150" height="80" rx="8" fill="#141414" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="20" y="270" width="150" height="24" rx="8" fill="#3B82F6"/>
    <rect x="20" y="286" width="150" height="8" fill="#3B82F6"/>
    <text x="30" y="287" font-size="11" font-weight="700" fill="#0A0A0A">dim_currency</text>
    <text x="30" y="320" font-size="10.5" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#FAFAFA">currency_id</text>
    <text x="162" y="320" font-size="9" font-weight="700" fill="#6FA8FA" text-anchor="end">PK</text>

    <!-- fact box -->
    <rect x="250" y="145" width="190" height="130" rx="8" fill="#141414" stroke="#6FA8FA" stroke-width="1.5"/>
    <text x="266" y="171" font-size="11" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#999999">date_id</text>
    <text x="424" y="171" font-size="9" font-weight="700" fill="#3B82F6" text-anchor="end">FK</text>
    <text x="266" y="195" font-size="11" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#999999">asset_id</text>
    <text x="424" y="195" font-size="9" font-weight="700" fill="#3B82F6" text-anchor="end">FK</text>
    <text x="266" y="219" font-size="11" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#999999">price_currency_id</text>
    <text x="424" y="219" font-size="9" font-weight="700" fill="#3B82F6" text-anchor="end">FK</text>
    <text x="266" y="243" font-size="10.5" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#999999">quantity_cumulative,</text>
    <text x="266" y="259" font-size="10.5" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#999999">portfolio_value_eur</text>
  </g>

  <!-- legend -->
  <g font-size="11.5" fill="#999999">
    <line x1="40" y1="825" x2="72" y2="825" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="80" y="829">FK relationship, tested by dbt</text>
  </g>
</svg>
