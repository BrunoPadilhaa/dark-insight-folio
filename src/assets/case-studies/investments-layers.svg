  </defs>

  <rect width="1210" height="400" fill="#0A0A0A"/>

  <!-- connectors -->
  <g fill="none" stroke="#3B82F6" stroke-width="1.75" opacity="0.85" marker-end="url(#arrow)">
    <path d="M302,135 L352,210"/>
