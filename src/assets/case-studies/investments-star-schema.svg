    <text x="266" y="178" font-size="11" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#999999">asset_id</text>
    <text x="424" y="178" font-size="9" font-weight="700" fill="#3B82F6" text-anchor="end">FK</text>
    <text x="266" y="202" font-size="11" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#999999">price_date_id</text>
    <text x="424" y="202" font-size="9" font-weight="700" fill="#3B82F6" text-anchor="end">FK</text>
    <text x="266" y="226" font-size="11" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#999999">price_currency_id</text>
    <text x="424" y="226" font-size="9" font-weight="700" fill="#3B82F6" text-anchor="end">FK</text>
    <text x="266" y="250" font-size="11" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#999999">price_adj_close</text>
