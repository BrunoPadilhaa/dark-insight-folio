    <text x="30" y="320" font-size="10.5" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#FAFAFA">transaction_type_id</text>
    <text x="162" y="320" font-size="9" font-weight="700" fill="#6FA8FA" text-anchor="end">PK</text>

    <!-- fact box -->
    <rect x="250" y="140" width="190" height="140" rx="8" fill="#141414" stroke="#6FA8FA" stroke-width="1.5"/>
    <text x="266" y="166" font-size="11" font-family="ui-monospace, Consolas, Menlo, monospace" font-weight="700" fill="#FAFAFA">transaction_id</text>
    <text x="424" y="166" font-size="9" font-weight="700" fill="#6FA8FA" text-anchor="end">PK</text>
    <text x="266" y="190" font-size="11" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#999999">asset_id</text>
    <text x="424" y="190" font-size="9" font-weight="700" fill="#3B82F6" text-anchor="end">FK</text>
    <text x="266" y="214" font-size="11" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#999999">currency_id</text>
    <text x="424" y="214" font-size="9" font-weight="700" fill="#3B82F6" text-anchor="end">FK</text>
    <text x="266" y="238" font-size="11" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#999999">transaction_type_id</text>
    <text x="424" y="238" font-size="9" font-weight="700" fill="#3B82F6" text-anchor="end">FK</text>
    <text x="266" y="262" font-size="11" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#999999">quantity, price, amount</text>
  </g>

  <!-- Panel 2: fct_asset_prices -->
  <g transform="translate(530,40)">
    <rect width="460" height="370" rx="10" fill="#141414" stroke="#262626" stroke-width="1.5"/>
    <text x="20" y="28" font-size="16" font-weight="700" fill="#6FA8FA">fct_asset_prices</text>
    <text x="20" y="46" font-size="10.5" font-style="italic" fill="#999999">1 row per asset_id + price_date_id</text>
    <line x1="20" y1="56" x2="440" y2="56" stroke="#262626"/>

    <g fill="none" stroke-width="1.5">
      <path d="M170,110 L250,210" stroke="#3B82F6" opacity="0.6"/>
      <path d="M170,210 L250,210" stroke="#3B82F6" opacity="0.6"/>
      <path d="M170,310 L250,210" stroke="#3B82F6" opacity="0.6"/>
    </g>

    <!-- dim_asset -->
    <rect x="20" y="70" width="150" height="80" rx="8" fill="#141414" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="20" y="70" width="150" height="24" rx="8" fill="#3B82F6"/>
    <rect x="20" y="86" width="150" height="8" fill="#3B82F6"/>
    <text x="30" y="87" font-size="11" font-weight="700" fill="#0A0A0A">dim_asset</text>
    <text x="30" y="120" font-size="10.5" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#FAFAFA">asset_id</text>
    <text x="162" y="120" font-size="9" font-weight="700" fill="#6FA8FA" text-anchor="end">PK</text>

    <!-- dim_currency -->
    <rect x="20" y="170" width="150" height="80" rx="8" fill="#141414" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="20" y="170" width="150" height="24" rx="8" fill="#3B82F6"/>
    <rect x="20" y="186" width="150" height="8" fill="#3B82F6"/>
    <text x="30" y="187" font-size="11" font-weight="700" fill="#0A0A0A">dim_currency</text>
    <text x="30" y="220" font-size="10.5" font-family="ui-monospace, Consolas, Menlo, monospace" fill="#FAFAFA">currency_id</text>
    <text x="162" y="220" font-size="9" font-weight="700" fill="#6FA8FA" text-anchor="end">PK</text>

    <!-- dim_date -->
    <rect x="20" y="270" width="150" height="80" rx="8" fill="#141414" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="20" y="270" width="150" height="24" rx="8" fill="#3B82F6"/>
